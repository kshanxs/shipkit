# ship-check.toml: the launch-readiness checklist for the ship-check skill. One checklist for every
# kind of project: hosted SaaS, self-hosted apps, CLIs, libraries and infrastructure scripts.
#
# Every list is configurable. `hints` are globs from the project root: the scaffold lists the
# files they match as "files to read" for that item; they are pointers, never verdicts.
# `requires` names the project-profile traits a group or item needs ([project] in shipkit.toml,
# else detected; `project.py --help` lists them; "!hosted" means "not hosted"). The scaffold keeps
# only what the profile has and lists what it left out. No `requires` means every project.
# `ship_check.py init` copies this file to the project root.

[product]
name = ""                         # default: the project folder's name

[target]
deploy_branch = "main"            # fixes that are not here yet are called out

# What the audit reads first. Documents can be stale: confirm each claim in the code.
[sources]
"status and plans" = ["docs/feature_status.md", "docs/feature_catalog.md", "docs/open_questions.md", "ROADMAP.md", "CHANGELOG.md"]
"bugs" = ["docs/testing/bug_report.md", "docs/testing/attack_log.md"]
"infrastructure" = ["docs/deployment/**/*.md", "docs/infrastructure*.md", "infra/**/*.tf", "Dockerfile", "docker-compose*.yml", "compose*.yml", "fly.toml", "render.yaml", "vercel.json"]
"ci" = [".github/workflows/*.yml", ".gitlab-ci.yml"]
"security" = ["SECURITY.md", "**/security/**/*.py", "**/middleware/**"]
"legal" = ["**/legal/**", "**/privacy*", "**/terms*", "LICENSE"]

# The operator console: what the team can do for a customer without touching the database.
[[capabilities]]
name = "Support and ticketing"
hints = ["**/support/**", "docs/**/support*.md"]
requires = ["hosted"]

[[capabilities]]
name = "Support access or impersonation, audited and time-limited"
hints = ["**/impersonat*", "**/support_access*", "**/admin/**"]
requires = ["hosted"]

[[capabilities]]
name = "Uptime and health"
hints = ["**/health*", "**/status*"]
requires = ["server"]

[[capabilities]]
name = "Configuration and feature flags"
hints = ["**/flags*", "**/feature_flag*", "**/config*"]
requires = ["server"]

[[capabilities]]
name = "Suspend or offboard a customer"
hints = ["**/suspend*", "**/offboard*", "**/admin/**"]
requires = ["hosted"]

[[capabilities]]
name = "Billing operations (refunds, credits, plan changes)"
hints = ["**/billing/**", "**/payments/**"]
requires = ["money"]

[[capabilities]]
name = "Audit log"
hints = ["**/audit*"]
requires = ["accounts"]

# Onboarding, in the order a user meets it. Compare each with common practice and name the gap.
[[flows]]
name = "Sign-up and email verification"
hints = ["**/auth/**", "**/signup*"]
requires = ["accounts"]

[[flows]]
name = "First workspace and its owner"
hints = ["**/onboarding/**", "**/workspaces/**"]
requires = ["multi-tenant"]

[[flows]]
name = "Inviting members and setting roles"
hints = ["**/invite*", "**/members/**"]
requires = ["accounts"]

[[flows]]
name = "Choosing a plan and paying"
hints = ["**/billing/**", "**/checkout*"]
requires = ["money"]

[[flows]]
name = "Install and first run (setup, first password, sensible defaults)"
hints = ["README.md", "docs/**/install*.md", "Dockerfile", "docker-compose*.yml", "compose*.yml", "umbrel-app.yml"]
requires = ["self-hosted"]

[[flows]]
name = "Upgrade to a new version without losing data or settings"
hints = ["CHANGELOG.md", "**/migrations/**", "docs/**/upgrad*.md"]
requires = ["self-hosted"]

[[flows]]
name = "Install and the first command (help text, errors that say what to do)"
hints = ["README.md", "pyproject.toml", "package.json", "Cargo.toml", "**/cli.py"]
requires = ["cli"]

[[flows]]
name = "Install and the first import (quick start that runs as written)"
hints = ["README.md", "docs/**/*.md", "examples/**"]
requires = ["library"]

[[flows]]
name = "First run on a clean machine (prerequisites checked, safe to run again)"
hints = ["README.md", "*.sh", "scripts/**"]
requires = ["shell"]

[[flows]]
name = "Developer and test accounts (never in production)"
hints = ["**/seed*", "**/fixtures/**", "seedbed.toml"]
requires = ["accounts"]

# The status checklist. `note` names the regulation or standard that applies to you: GDPR, CCPA,
# HIPAA, PCI DSS, SOC 2, a national data-protection law. Replace or add items to match it.
[[checklist]]
group = "Privacy and data protection"
note = "name the regulations that apply"
hints = ["**/privacy*", "**/consent*", "**/retention*", "**/gdpr*", "docs/**/privacy*.md"]
requires = ["hosted"]
items = ["Consent recorded where it is needed", "Data minimisation", "Retention and deletion", "Breach notification process", "Data subject rights (access, export, delete)", "Sub-processors listed"]

[[checklist]]
group = "Security"
items = [
  { name = "Audit logging", hints = ["**/audit*"], requires = ["accounts"] },
  { name = "Rate limiting", hints = ["**/rate_limit*", "**/ratelimit*", "**/throttl*"], requires = ["server"] },
  { name = "Tenant isolation (row-level security or scoped queries, tested)", hints = ["**/tenant*", "**/rls*", "**/test_*isolation*"], requires = ["multi-tenant"] },
  { name = "How tokens and sessions are stored", hints = ["**/auth/**", "**/session*"], requires = ["auth"] },
  { name = "Cross-site requests refused (Origin or CSRF checks on every change)", hints = ["**/middleware/**", "**/csrf*", "**/security*"], requires = ["server"] },
  { name = "DNS rebinding refused (Host header checked against an allow-list)", hints = ["**/middleware/**", "**/host*", "**/security*"], requires = ["self-hosted"] },
  { name = "Listens only where it should (bind address, local network or internet, documented)", hints = ["Dockerfile", "docker-compose*.yml", "compose*.yml", "**/config*"], requires = ["self-hosted"] },
  { name = "Secrets and tokens on disk protected (file permissions, never logged)", hints = ["**/config*", "**/secrets*", "**/token*"], requires = ["!hosted"] },
  { name = "Secrets management (no secrets in the repository)", hints = [".env.example", "**/secrets*", ".gitignore"] },
]

[[checklist]]
group = "Resilience"
items = ["Backups", "A restore that has been tested", "Disaster recovery with RPO and RTO stated"]
hints = ["docs/**/backup*.md", "docs/**/disaster*.md", "infra/**"]
requires = ["hosted"]

[[checklist]]
group = "Data safety for self-hosted users"
items = ["Where data lives is documented (mounted folders, paths)", "Backup and restore documented for the user", "A failed upgrade can roll back"]
hints = ["README.md", "docs/**/*.md", "docker-compose*.yml", "compose*.yml", "umbrel-app.yml"]
requires = ["self-hosted"]

[[checklist]]
group = "Observability"
items = ["Structured logs", "Metrics", "Traces", "Alerts that page someone"]
hints = ["**/logging*", "**/telemetry*", "**/metrics*", "**/sentry*", "**/otel*"]
requires = ["hosted"]

[[checklist]]
group = "Delivery"
items = [
  { name = "SLOs", requires = ["hosted"] },
  { name = "CI with required checks", hints = [".github/workflows/*.yml"] },
  { name = "A deploy workflow", hints = [".github/workflows/*.yml", "docs/deployment/**"], requires = ["hosted"] },
  { name = "A staging environment", hints = ["docs/deployment/**"], requires = ["hosted"] },
]

[[checklist]]
group = "Releases and distribution"
items = ["Versioned releases with a changelog", "Install instructions that work on a clean machine", "Upgrade notes for every breaking change", "The package, image or binary is built by CI, not by hand"]
hints = ["CHANGELOG.md", "README.md", ".github/workflows/*.yml", "pyproject.toml", "package.json", "Cargo.toml", "Dockerfile"]
requires = ["!hosted"]

[[checklist]]
group = "Scripts that change machines"
items = ["Safe to run twice", "A dry run that changes nothing", "Fails loudly (set -euo pipefail or the equivalent)", "Lint clean (shellcheck)", "Tested (bats, or a run in a throwaway container)"]
hints = ["*.sh", "scripts/**", ".github/workflows/*.yml"]
requires = ["shell"]

[[checklist]]
group = "Supply chain"
items = ["Dependency updates", "Vulnerability scanning", "Secret scanning"]
hints = [".github/dependabot.yml", "renovate.json", ".github/workflows/*.yml", ".gitleaks.toml"]

[[checklist]]
group = "Operations"
items = ["Incident response runbook", "Support and ticketing", "More than one server or region", "Infrastructure as code"]
hints = ["docs/**/runbook*.md", "docs/**/incident*.md", "infra/**"]
requires = ["hosted"]

[pricing]
hints = ["docs/**/pricing*.md", "**/pricing*", "**/plans*"]
requires = ["plans"]
items = ["Plans and their prices", "Per-seat or usage price", "Minimums and steps", "Quantity-based tiers", "Tax (VAT, GST, sales tax)", "Trial and grace days", "Payment provider fees", "Unit economics (cost to serve one customer)"]

[bugs]
hints = ["docs/testing/bug_report.md"]
