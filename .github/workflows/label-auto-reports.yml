name: label auto reports
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    if: contains(github.event.issue.body, '<!-- shipkit-auto:')
    runs-on: ubuntu-latest
    steps:
      - name: Mark the report for the maintainer's review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create needs-review --repo "$REPO" --color fbca04 --description "Automatic report waiting for a maintainer" --force
          gh label create auto-report --repo "$REPO" --color c5def5 --description "Drafted by a coding agent from project work" --force
          gh label create field-report --repo "$REPO" --color 5319e7 --description "Lesson from real project work, to fold into a skill" --force
          gh label create accepted --repo "$REPO" --color 0e8a16 --description "Reviewed by a maintainer and ready to work on" --force
          gh issue edit "$NUMBER" --repo "$REPO" --add-label needs-review --add-label auto-report --add-label field-report
