name: Bug report
description: A script, installer, command or skill does the wrong thing.
title: "<skill or area>: <what goes wrong>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is public. Remove secrets, private paths, hostnames and client or project names from everything you paste.
  - type: input
    id: area
    attributes:
      label: Skill, command or area
      placeholder: "profile, /break, install.sh, doctor.py"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact command and its output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest project or file layout that shows the problem.
      placeholder: |
        1. Create a project containing ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent
      options:
        - Claude Code
        - Cursor
        - Codex
        - Trae
        - None (ran the script directly)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and the shipkit commit or install method.
      placeholder: "Ubuntu 24.04, Python 3.13, commit abc1234, install.sh --global"
    validations:
      required: true
