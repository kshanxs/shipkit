name: Feature or new skill
description: Suggest a new skill, stack, agent, kit or capability.
title: "<area>: <what you want>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Shipkit is for all kinds of software development. Requests for other stacks, project types and coding agents are welcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should shipkit do?
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who it helps
      description: Which kinds of projects, stacks or agents would use this?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
